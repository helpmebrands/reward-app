name: reward-app
runtime:
  name: nodejs
  options:
    typescript: true
description: Infrastructure for HelpMe Reward — Artifact Registry, Cloud Run, and keyless GitHub deploys.

# Only this project's own namespace is declared here. Provider settings
# (gcp:project, gcp:region) are not — Pulumi requires a concrete `value` for a
# namespaced key declared at project level, and those belong per-stack.
config:
  githubRepo:
    type: string
    description: The repository allowed to deploy, as "owner/name". Pins the trust boundary.
  serviceName:
    type: string
    description: Cloud Run service name.
    default: reward-app
  minInstances:
    type: integer
    description: Warm instances. 0 is cheapest and accepts a cold start.
    default: 0
  maxInstances:
    type: integer
    description: Ceiling on concurrent instances, and therefore on spend.
    default: 4
  customDomain:
    type: string
    description: Optional custom domain. Requires prior domain verification — see runbook 03.
    default: ""
