name: reward-app
runtime:
  name: nodejs
  options:
    typescript: true
description: Infrastructure for HelpMe Reward — the api on Cloud Run, the site on Cloudflare Pages, and keyless GitHub deploys.

# Only this project's own namespace is declared here. Provider settings
# (gcp:project, gcp:region) are not — Pulumi requires a concrete `value` for a
# namespaced key declared at project level, and those belong per-stack.
config:
  githubRepo:
    type: string
    description: The repository allowed to deploy, as "owner/name". Pins the trust boundary.
  serviceName:
    type: string
    description: Prefixes the registry, the deploy and Play identities and the secrets. Named after the retired site service; renaming it recreates them.
    default: reward-app
  minInstances:
    type: integer
    description: Warm instances. 0 is cheapest and accepts a cold start.
    default: 0
  maxInstances:
    type: integer
    description: Ceiling on concurrent instances, and therefore on spend.
    default: 4
  customDomain:
    type: string
    description: The site's domain on Cloudflare Pages, e.g. staging.helpmereward.com; the apex on prod (runbook 09).
    default: ""
  cloudflareAccountId:
    type: string
    description: The Cloudflare account holding the Pages project (runbook 09). Blank leaves the site out.
    default: ""
  cloudflareZoneId:
    type: string
    description: The Cloudflare zone id of helpmereward.com, where the site's CNAME goes (runbook 09).
    default: ""
  pagesProject:
    type: string
    description: The Cloudflare Pages project name for this stack, e.g. helpmereward-staging.
    default: ""
  siteBranch:
    type: string
    description: The git branch that deploys to this stack's Pages project, its production branch.
    default: develop
  apiServiceName:
    type: string
    description: Cloud Run service name for the api; also prefixes its runtime identity and secret.
    default: reward-api
  dbTier:
    type: string
    description: Cloud SQL machine tier. db-f1-micro is the smallest and cheapest; raise it with load.
    default: db-f1-micro
  stateBucket:
    type: string
    description: The GCS bucket holding this stack's state (runbook 01 step 2). The deployer may lock it to preview.
  secretsKey:
    type: string
    description: The KMS key encrypting this stack's secrets, as projects/…/cryptoKeys/…. The deployer may decrypt with it to preview.
  billingAccount:
    type: string
    description: The billing account the project charges to, as XXXXXX-XXXXXX-XXXXXX. Set with `pulumi config set --secret`; the id never appears in plain text in this repository.
  apiCustomDomain:
    type: string
    description: The api's own domain, which invite links point at (issue 221). Requires the parent domain verified and a CNAME, as for customDomain.
    default: ""
  androidSha256Fingerprints:
    type: string
    description: SHA-256 fingerprints of the Android signing certificates, comma separated, served in assetlinks.json so invite links open the app.
    default: ""
  googleOAuthClientId:
    type: string
    description: The web OAuth client id behind Google sign-in (runbook 08). Blank leaves the Google provider out.
    default: ""
  googleOAuthClientSecret:
    type: string
    description: That client's secret. Set with `pulumi config set --secret`.
    default: ""
  appleServicesId:
    type: string
    description: The Sign in with Apple Services ID, e.g. com.helpmebrands.reward.signin (runbook 08). Blank leaves the Apple provider out.
    default: ""
  appleKeyId:
    type: string
    description: The id of the Sign in with Apple key; read by the appleSignInConfig PATCH in runbook 08.
    default: ""
  appleServicesKey:
    type: string
    description: The Sign in with Apple .p8 private key. Set with `pulumi config set --secret`; read by the PATCH in runbook 08.
    default: ""
  appleTeamId:
    type: string
    description: The Apple Developer team id; read by the PATCH in runbook 08.
    default: ""
  budgetAmount:
    type: integer
    description: Monthly budget in USD for the alert on this stack's project. Emails billing-account administrators at 50, 90 and 100 percent.
    default: 25
