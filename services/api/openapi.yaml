openapi: 3.1.0
info:
  title: HelpMe Reward api
  version: 0.1.0
  summary: The service tier behind the HelpMe Reward app.
  description: |
    Hand-written and spec-first: every route, parameter and body is
    documented here before it is served, and `test/contract_test.dart`
    holds the router and every response to this file. Nothing is generated
    from it. Bodies are JSON in the domain's snapshot spelling
    (`packages/domain/lib/src/json.dart`).
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://reward-api-bduraqeztq-uc.a.run.app
    description: staging
tags:
  - name: health
    description: Liveness.
  - name: devices
    description: Push-device registration.
  - name: invite links
    description: What lets an invite link open the app, and the page it shows without it.
  - name: me
    description: The signed-in caller.
  - name: sharing
    description: Invites, and the shares they create from one person to another.
  - name: catalog
    description: The versioned card catalogue.
  - name: catalog admin
    description: Drafting and publishing catalogue versions. Admins only.
  - name: household data
    description: |
      The cards a person owns and the ones shared with them, with their
      credits and claims. Only a card's owner changes the card; a share
      lets the other person view it, or also record usage.
security:
  - firebase: []

paths:
  /health:
    get:
      tags: [health]
      operationId: getHealth
      security: []
      summary: Liveness
      description: |
        200 while the process serves, with the version so a deploy can be
        told apart from the last one. Not `/healthz`, which Google's
        frontend answers itself on `run.app` hosts.
      responses:
        '200':
          description: The process is serving.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '500':
          $ref: '#/components/responses/Internal'

  /.well-known/apple-app-site-association:
    get:
      tags: [invite links]
      operationId: getAppleAppSiteAssociation
      security: []
      summary: iOS universal links for /invite/*
      description: Fetched by iOS from the api's own domain; names the app that opens invite links.
      responses:
        '200':
          description: The association file.
          content:
            application/json:
              schema:
                type: object
                required: [applinks]
        '500':
          $ref: '#/components/responses/Internal'

  /.well-known/assetlinks.json:
    get:
      tags: [invite links]
      operationId: getAssetLinks
      security: []
      summary: Android App Links for the api's domain
      description: Fetched by Android; names the package and its signing certificates.
      responses:
        '200':
          description: The statement list.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [relation, target]
        '500':
          $ref: '#/components/responses/Internal'

  /invite/{code}:
    get:
      tags: [invite links]
      operationId: getInvitePage
      security: []
      summary: An invite link without the app
      description: |
        With the app installed the operating system opens the link in the
        app; otherwise this page shows the code and both stores.
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The page.
          content:
            text/html:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'

  /og/invite.png:
    get:
      tags: [invite links]
      operationId: getInviteImage
      security: []
      summary: The card an invite link previews as
      description: |
        The 1200×630 image the invite page's `og:image` names, for the
        preview a messenger or the share sheet builds from the link.
      responses:
        '200':
          description: The image.
          content:
            image/png:
              schema:
                type: string
                contentEncoding: binary
        '500':
          $ref: '#/components/responses/Internal'

  /v1/me:
    get:
      tags: [me]
      operationId: getMe
      summary: The signed-in caller
      description: |
        The caller's user, created on their first authenticated call to any
        route and reused after.
      responses:
        '200':
          description: The caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/catalog:
    get:
      tags: [catalog]
      operationId: getCatalog
      summary: Every template as it stands today
      description: |
        Each template's latest published version whose `effectiveFrom` has
        passed, by the database's date. Drafts never appear.
      responses:
        '200':
          description: The catalogue.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TemplateVersion'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/catalog/{templateId}:
    get:
      tags: [catalog]
      operationId: getTemplateVersions
      summary: Every published version of one template
      parameters:
        - name: templateId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The template's published versions, oldest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateHistory'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/admin/catalog:
    post:
      tags: [catalog admin]
      operationId: createTemplate
      summary: Create a template as a draft version 1
      description: |
        Admin only. The template is invisible to the catalogue until its
        draft is published.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewTemplate'
      responses:
        '201':
          description: The new draft.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminVersion'
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: A template with that id exists (`template exists`).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
                properties:
                  error:
                    enum: [template exists]
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/admin/catalog/{templateId}/drafts:
    post:
      tags: [catalog admin]
      operationId: createDraft
      summary: Start a draft from the latest version
      description: |
        Admin only. Copies the latest published version into version n + 1
        as a draft. One draft at a time per template.
      parameters:
        - $ref: '#/components/parameters/TemplateId'
      responses:
        '201':
          description: The draft.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminVersion'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The template already has an open draft (`draft exists`).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
                properties:
                  error:
                    enum: [draft exists]
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/admin/catalog/{templateId}/drafts/{version}:
    put:
      tags: [catalog admin]
      operationId: editDraft
      summary: Replace a draft's terms
      description: |
        Admin only. The whole template as it should read: its fields and
        every credit. Checked by the domain's rules; `effectiveFrom` may be
        left out to keep the draft's.
      parameters:
        - $ref: '#/components/parameters/TemplateId'
        - $ref: '#/components/parameters/Version'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DraftTerms'
      responses:
        '200':
          description: The draft as stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminVersion'
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: That version is published and cannot change (`published`); start a new draft.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
                properties:
                  error:
                    enum: [published]
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/admin/catalog/{templateId}/drafts/{version}/publish:
    post:
      tags: [catalog admin]
      operationId: publishDraft
      summary: Publish a draft
      description: |
        Admin only. Records who published it, when, and from what source,
        and writes a `version published` event. The version never changes
        again.
      parameters:
        - $ref: '#/components/parameters/TemplateId'
        - $ref: '#/components/parameters/Version'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishRequest'
      responses:
        '200':
          description: The published version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminVersion'
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: That version is published already (`published`).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
                properties:
                  error:
                    enum: [published]
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'


  /v1/me/preferences:
    get:
      tags: [me]
      operationId: getPreferences
      summary: The caller's notification preferences and mutes
      description: |
        The caller's own: the defaults until they change them, and the mutes
        and last calls on the cards they can see.
      responses:
        '200':
          description: The preferences.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberPreferences'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
    put:
      tags: [me]
      operationId: putPreferences
      summary: Replace the caller's notification settings
      description: Anyone may set their own; mutes have their own routes and are left as they are.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationSettings'
      responses:
        '200':
          description: The preferences.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberPreferences'
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/me/mutes/cards/{cardId}:
    put:
      tags: [me]
      operationId: muteCard
      summary: Silence a card for the caller only
      description: Idempotent. Anyone who can see it may mute it, since nothing shared changes; anything they cannot see is 404.
      parameters:
        - name: cardId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Muted.
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
    delete:
      tags: [me]
      operationId: unmuteCard
      summary: Hear about a card again
      parameters:
        - name: cardId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Unmuted, or it was not muted.
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/me/mutes/benefits/{benefitId}:
    put:
      tags: [me]
      operationId: muteBenefit
      summary: Silence a benefit for the caller only
      description: Idempotent. Anyone who can see it may mute it, since nothing shared changes; anything they cannot see is 404.
      parameters:
        - name: benefitId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Muted.
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
    delete:
      tags: [me]
      operationId: unmuteBenefit
      summary: Hear about a benefit again
      parameters:
        - name: benefitId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Unmuted, or it was not muted.
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/me/benefits/{benefitId}/level:
    put:
      tags: [me]
      operationId: setNotificationLevel
      summary: Set a credit's notification level for the caller only
      description: |
        Periodically clears the credit's mute and last call, Last chance
        sets last call and clears the mute, Silence sets the mute and keeps
        last call. Anyone who can see the credit may set their own, since
        nothing shared changes; anything they cannot see is 404.
      parameters:
        - name: benefitId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [level]
              properties:
                level:
                  $ref: '#/components/schemas/NotificationLevel'
      responses:
        '200':
          description: The caller's preferences after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberPreferences'
        '400':
          $ref: '#/components/responses/Invalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/invites:
    post:
      tags: [sharing]
      operationId: createInvite
      summary: Invite someone to see your cards
      description: |
        The invite carries the share it creates: the access, and all the
        caller's cards (including ones added later) or the cards in
        `cardIds`, which must be the caller's own. The code is single-use
        and expires after seven days; the link carries the same code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteRequest'
      responses:
        '201':
          description: The invite.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invite'
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: A card in `cardIds` is not the caller's (`not found`).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
                properties:
                  error:
                    const: not found
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/invites/{code}:
    get:
      tags: [sharing]
      operationId: readInvite
      summary: What an invite shares
      description: |
        Who is sharing, at which access, and all their cards or how many,
        for the join screen.
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The invite's offer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteOffer'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/InviteGone'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/invites/{code}/accept:
    post:
      tags: [sharing]
      operationId: acceptInvite
      summary: Accept a share
      description: |
        Creates the share the invite carries, from its owner to the caller,
        and marks the invite used. Nothing of the caller's is moved or
        deleted. An invite of the caller's own, or one from someone who
        already shares with the caller, is refused; the owner changes the
        existing share instead.
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The share, as the caller sees it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Share'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The caller's own invite (`own invite`), or its owner already shares with the caller (`already shared`).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
                properties:
                  error:
                    enum: [own invite, already shared]
        '410':
          $ref: '#/components/responses/InviteGone'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/shares:
    get:
      tags: [sharing]
      operationId: listShares
      summary: Who sees your cards, and whose cards you see
      description: |
        `given` is each person the caller shares with and `received` each
        person who shares with the caller, both as the other person with
        the access and all cards or the chosen card ids.
      responses:
        '200':
          description: The shares both ways.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shares'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/shares/{memberId}:
    patch:
      tags: [sharing]
      operationId: changeShare
      summary: Change what someone sees of your cards
      description: |
        Changes the access, or the scope: all cards (including ones added
        later) or the chosen `cardIds`, which must be the caller's own.
        Keys left out stay as they are; `allCards: false` needs `cardIds`.
      parameters:
        - name: memberId
          in: path
          required: true
          description: The user id of the person the caller shares with.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SharePatch'
      responses:
        '200':
          description: The share, as the caller gives it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Share'
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: The caller does not share with that person, or a card in `cardIds` is not the caller's (`not found`).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
                properties:
                  error:
                    const: not found
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
    delete:
      tags: [sharing]
      operationId: stopSharing
      summary: Stop sharing your cards with someone
      description: |
        Takes effect at once and deletes nothing else: the cards, their
        claims, and the other person's own mutes on them stay, in case the
        cards are shared again.
      parameters:
        - name: memberId
          in: path
          required: true
          description: The user id of the person the caller shares with.
          schema:
            type: string
      responses:
        '204':
          description: No longer shared.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/shares/received/{ownerId}:
    delete:
      tags: [sharing]
      operationId: stopSeeing
      summary: Stop seeing someone's cards
      description: |
        Ends the share from the receiving side, at once, deleting nothing
        else; the caller's own mutes on those cards stay.
      parameters:
        - name: ownerId
          in: path
          required: true
          description: The user id of the person who shares with the caller.
          schema:
            type: string
      responses:
        '204':
          description: No longer seen.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/household/data:
    get:
      tags: [household data]
      operationId: getHouseholdData
      summary: The caller's cards and the ones shared with them
      description: |
        The domain's `AppData` snapshot of every card the caller can see:
        their own and the ones shared with them, each with its `ownerId`. A
        linked card takes its issuer, product, network and fee from its
        template's version in force; each linked credit is resolved against
        the version in force when its current cycle began. Beside the
        snapshot, `access` says what the caller may do with each card and
        `people` names the owner of each card shared with them.
      responses:
        '200':
          description: The cards as a snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppData'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/cards:
    post:
      tags: [household data]
      operationId: addCard
      summary: Add a card from a template, or one the owner maintains
      description: |
        The caller owns the card. With `templateId` it follows that
        template; without, the body carries the card's own terms. A card
        without a label that would repeat the display name of another of
        the caller's cards is given the first free "<product> (n)"; a label
        another of their cards already shows is 409. Cards shared with the
        caller do not count.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewCard'
      responses:
        '201':
          description: The card and its credits.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardWithBenefits'
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          description: The label is another of the caller's cards' display name (`label taken`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/cards/{cardId}:
    patch:
      tags: [household data]
      operationId: editCard
      summary: Change a card's own fields
      description: |
        The owner's alone. Label, kind, last four, anniversary and archived
        on any card; issuer, product, network and fee only on a card the
        owner maintains, and 409 `system maintained` on a linked one.
      parameters:
        - name: cardId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardPatch'
      responses:
        '200':
          description: The card.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: A term field on a linked card (`system maintained`) or a label another of the owner's cards shows (`label taken`).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
                properties:
                  error:
                    enum: [system maintained, label taken]
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
    delete:
      tags: [household data]
      operationId: deleteCard
      summary: Delete a card with its credits and claims
      description: The owner's alone.
      parameters:
        - name: cardId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/cards/{cardId}/terms-seen:
    post:
      tags: [household data]
      operationId: markTermsSeen
      summary: Clear the caller's "terms changed" mark on a card
      description: |
        For the caller only; everyone else who sees the card keeps theirs.
        204 whether or not there was a mark. Anyone who can see the card
        may.
      parameters:
        - name: cardId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Cleared.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/cards/{cardId}/convert:
    post:
      tags: [household data]
      operationId: convertCard
      summary: Convert a linked card into one the owner maintains
      description: |
        The owner's alone. One transaction: a new card and credits copying
        the terms resolved today and every piece of the card's state; the
        claims, everyone's mutes and last calls, and the card's place in
        chosen-card shares and pending invites move to the new ids; the
        linked card is deleted. The new card no longer follows the
        catalogue. The answer names the card it replaces and maps each old
        credit id to its new one.
      parameters:
        - name: cardId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The new card and its credits.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConvertedCard'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The card is maintained by its owner already (`user maintained`).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
                properties:
                  error:
                    const: user maintained
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/cards/{cardId}/transfer:
    post:
      tags: [household data]
      operationId: transferCard
      summary: Hand a card to someone it is shared with
      description: |
        The owner's alone. One transaction: the new owner, who must already
        see the card, owns it; the previous owner keeps seeing it through
        the new owner's share with them (the card joins its chosen cards,
        or a new share gives it to them to record usage); the previous
        owner's other shares stop covering it. Claims, credits, their state
        and everyone's mutes stay.
      parameters:
        - name: cardId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId:
                  type: string
                  description: The user id of the new owner.
      responses:
        '204':
          description: Handed over.
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The caller cannot see the card, or the new owner cannot (`not found`).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
                properties:
                  error:
                    const: not found
        '409':
          description: One of the new owner's cards already has its name (`label taken`).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
                properties:
                  error:
                    const: label taken
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/cards/{cardId}/benefits:
    post:
      tags: [household data]
      operationId: addBenefit
      summary: Add a credit to a card the owner maintains
      description: The owner's alone. A linked card's credits come from its template; adding one is 409 `system maintained`.
      parameters:
        - name: cardId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreditTerms'
      responses:
        '201':
          description: The credit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Benefit'
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/SystemMaintained'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/benefits/{benefitId}:
    put:
      tags: [household data]
      operationId: editBenefit
      summary: Replace a household credit's terms
      description: The owner's alone, and only on a credit they maintain; a linked credit is 409 `system maintained`.
      parameters:
        - name: benefitId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreditTerms'
      responses:
        '200':
          description: The credit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Benefit'
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/SystemMaintained'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
    delete:
      tags: [household data]
      operationId: deleteBenefit
      summary: Delete a household credit and its claims
      description: The owner's alone. A linked credit is 409 `system maintained`; opt out of it through its state instead.
      parameters:
        - name: benefitId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/SystemMaintained'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/benefits/{benefitId}/state:
    put:
      tags: [household data]
      operationId: putBenefitState
      summary: Change a credit's state
      description: |
        Enrollment, spend met, active, opted out and tracked from, on any
        credit, linked or not, for the owner and anyone the card is shared
        with to record usage. Absent keys stay as they are; null clears.
      parameters:
        - name: benefitId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BenefitState'
      responses:
        '200':
          description: The credit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Benefit'
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/claims:
    post:
      tags: [household data]
      operationId: addClaim
      summary: Log a claim, once
      description: |
        For the owner and anyone the card is shared with to record usage.
        Needs an `Idempotency-Key`, unique per person who records. The same
        key with the same body answers the stored claim again; with a
        different body it is 409.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Generated by the client once per claim and sent with every retry.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewClaim'
      responses:
        '201':
          description: The claim.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Claim'
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The key was used for a different claim (`idempotency key reused`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/claims/{claimId}:
    delete:
      tags: [household data]
      operationId: deleteClaim
      summary: Remove a claim
      description: For the owner and anyone the card is shared with to record usage.
      parameters:
        - name: claimId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Removed.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'


  /v1/me/reminders/summary:
    get:
      tags: [me]
      operationId: getReminderSummary
      summary: How many reminders the caller has scheduled, and the next
      description: |
        The caller's own schedule from now on, in the zone of their most
        recently registered device (UTC before they have one), with their
        preferences and mutes. Reminders off is a count of 0.
      responses:
        '200':
          description: The summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReminderSummary'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/me/reminders/test:
    post:
      tags: [me]
      operationId: sendTestReminder
      summary: Send a test notification to each of the caller's devices
      description: |
        A token FCM reports unregistered is removed. 503 `no push` when the
        server has no FCM project. `delaySeconds` (0 to 10, default 0) makes
        the server wait before sending, inside the request, so the tester
        can put the app in the background and see the banner.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestPushRequest'
      responses:
        '200':
          description: How many devices took it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestPush'
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/devices:
    post:
      tags: [devices]
      operationId: registerDevice
      summary: Register one of the caller's devices for push
      description: |
        Upserts by token: a repeat registration replaces the member,
        installation, platform and zone, since whoever registers a token
        last is the one signed in on it. The zone must be known to
        Postgres's `pg_timezone_names`; the newest device's zone is the one
        the caller's reminders keep.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Device'
      responses:
        '200':
          description: Registered; the stored fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/devices/{token}:
    delete:
      tags: [devices]
      operationId: unregisterDevice
      summary: Unregister one of the caller's devices, as on sign-out
      parameters:
        - name: token
          in: path
          required: true
          description: The FCM token the device registered under.
          schema:
            type: string
      responses:
        '204':
          description: Removed.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'

components:
  parameters:
    TemplateId:
      name: templateId
      in: path
      required: true
      schema:
        type: string
    Version:
      name: version
      in: path
      required: true
      schema:
        type: integer

  securitySchemes:
    firebase:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A Firebase ID token from Identity Platform (Google or Apple sign-in)
        for this environment's project, verified against Google's published
        keys: RS256, issuer `https://securetoken.google.com/<project>`,
        audience the project, unexpired.

  schemas:
    User:
      type: object
      required: [id, email]
      additionalProperties: false
      properties:
        id:
          type: string
          description: The user's id in this service.
        email:
          type: [string, 'null']
          description: The email on the sign-in account, when it shares one.

    Health:
      type: object
      required: [status, version]
      additionalProperties: false
      properties:
        status:
          const: ok
        version:
          type: string
          description: The api's package version.

    Device:
      type: object
      required: [token, installationId, platform, timezone]
      additionalProperties: false
      properties:
        token:
          type: string
          minLength: 1
          description: The FCM registration token.
        installationId:
          type: string
          minLength: 1
          description: An id the app generated for its own installation.
        platform:
          type: string
          enum: [ios, android]
        timezone:
          type: string
          minLength: 1
          description: An IANA zone name, such as `Europe/London`.

    ReminderSummary:
      type: object
      required: [count, next]
      additionalProperties: false
      properties:
        count:
          type: integer
          minimum: 0
          description: Reminders scheduled over the schedule's horizon.
        next:
          oneOf:
            - type: 'null'
            - type: object
              required: [fireAt, title, body]
              additionalProperties: false
              properties:
                fireAt:
                  type: string
                  format: date-time
                title:
                  type: string
                body:
                  type: string

    TestPushRequest:
      type: object
      additionalProperties: false
      properties:
        delaySeconds:
          type: integer
          minimum: 0
          maximum: 10
          description: Seconds to wait before sending; 0 when absent.

    TestPush:
      type: object
      required: [sent]
      additionalProperties: false
      properties:
        sent:
          type: integer
          minimum: 0

    TemplateCredit:
      type: object
      description: One credit of a template version, in the domain's spelling (`BenefitTemplate`).
      required: [id, name, category, icon, valueCents, cadence, anchor, enrollmentRequired, redemptionSteps]
      additionalProperties: false
      properties:
        id:
          type: string
          pattern: '^[a-z0-9-]+/[a-z0-9-]+$'
          description: Stable across versions, `<template id>/<slug>`.
        name:
          type: string
        description:
          type: string
        category:
          type: string
          enum: [travel, dining, shopping, entertainment, rideshare, wellness, lodging, airline, streaming, fee_credit, other]
        icon:
          type: string
        merchant:
          type: string
        valueCents:
          type: integer
          minimum: 1
        cadence:
          type: string
          enum: [monthly, quarterly, semiannual, annual, rolling, manual]
        anchor:
          type: string
          enum: [calendar, anniversary]
        intervalMonths:
          type: integer
        enrollmentRequired:
          type: boolean
        spendThresholdCents:
          type: integer
        endsOn:
          type: string
          format: date
        redemptionSteps:
          type: array
          items:
            type: string
        notes:
          type: string

    TemplateVersion:
      type: object
      description: A whole card template as of one version.
      required: [id, version, effectiveFrom, issuer, product, network, kind, annualFeeCents, credits]
      additionalProperties: false
      properties:
        id:
          type: string
        version:
          type: integer
          minimum: 1
        effectiveFrom:
          type: string
          format: date
        issuer:
          type: string
        product:
          type: string
        network:
          type: string
          enum: [amex, visa, mastercard, discover, other]
        kind:
          type: string
          enum: [personal, business]
        annualFeeCents:
          type: integer
          minimum: 0
        credits:
          type: array
          items:
            $ref: '#/components/schemas/TemplateCredit'

    DraftTerms:
      type: object
      description: A template version's terms as an admin writes them.
      required: [issuer, product, network, kind, annualFeeCents, credits]
      properties:
        effectiveFrom:
          type: string
          format: date
        issuer:
          type: string
        product:
          type: string
        network:
          type: string
          enum: [amex, visa, mastercard, discover, other]
        kind:
          type: string
          enum: [personal, business]
        annualFeeCents:
          type: integer
          minimum: 0
        credits:
          type: array
          items:
            $ref: '#/components/schemas/TemplateCredit'

    NewTemplate:
      allOf:
        - $ref: '#/components/schemas/DraftTerms'
      required: [id]
      properties:
        id:
          type: string
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'

    PublishRequest:
      type: object
      required: [effectiveFrom, sourceUrl]
      properties:
        effectiveFrom:
          type: string
          format: date
        sourceUrl:
          type: string
          format: uri
          description: Where the terms were read, an http or https address.
        notes:
          type: string

    AdminVersion:
      description: A version with its status and, once published, its provenance.
      type: object
      required: [id, version, effectiveFrom, issuer, product, network, kind, annualFeeCents, credits, status]
      additionalProperties: false
      properties:
        id:
          type: string
        version:
          type: integer
        effectiveFrom:
          type: string
          format: date
        issuer:
          type: string
        product:
          type: string
        network:
          type: string
        kind:
          type: string
        annualFeeCents:
          type: integer
        credits:
          type: array
          items:
            $ref: '#/components/schemas/TemplateCredit'
        status:
          type: string
          enum: [draft, published]
        publishedBy:
          type: string
        publishedAt:
          type: string
          format: date-time
        sourceUrl:
          type: string
        notes:
          type: string

    TemplateHistory:
      type: object
      required: [id, versions]
      additionalProperties: false
      properties:
        id:
          type: string
        versions:
          type: array
          items:
            $ref: '#/components/schemas/TemplateVersion'

    Card:
      type: object
      description: A card in the domain's snapshot spelling.
      required: [id, issuer, product, network, kind, annualFeeCents, anniversaryOn, archived, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id:
          type: string
        ownerId:
          type: string
          description: The user id of the person who added the card, who alone changes it.
        templateId:
          type: string
          description: The catalogue template it follows; absent on a card its owner maintains.
        label:
          type: string
        issuer:
          type: string
        product:
          type: string
        network:
          type: string
          enum: [amex, visa, mastercard, discover, other]
        kind:
          type: string
          enum: [personal, business]
        last4:
          type: string
        annualFeeCents:
          type: integer
        anniversaryOn:
          type: string
          format: date
        archived:
          type: boolean
        createdAt:
          type: string
        updatedAt:
          type: string

    Benefit:
      type: object
      description: A credit in the domain's snapshot spelling.
      required: [id, cardId, name, category, valueCents, cadence, anchor, enrollmentRequired, redemptionSteps, active, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id:
          type: string
        cardId:
          type: string
        templateBenefitId:
          type: string
        name:
          type: string
        description:
          type: string
        category:
          type: string
        icon:
          type: string
        merchant:
          type: string
        valueCents:
          type: integer
        cadence:
          type: string
        anchor:
          type: string
        intervalMonths:
          type: integer
        enrollmentRequired:
          type: boolean
        enrolledAt:
          type: string
        enrollmentNote:
          type: string
        enrollmentUrl:
          type: string
        spendThresholdCents:
          type: integer
        spendMetAt:
          type: string
        endsOn:
          type: string
          format: date
        redemptionSteps:
          type: array
          items:
            type: string
        notes:
          type: string
        active:
          type: boolean
        optedOutAt:
          type: string
        trackedFrom:
          type: string
          format: date
        createdAt:
          type: string
        updatedAt:
          type: string

    Claim:
      type: object
      required: [id, benefitId, cycleKey, amountCents, claimedAt]
      additionalProperties: false
      properties:
        id:
          type: string
        benefitId:
          type: string
        cycleKey:
          type: string
          format: date
        amountCents:
          type: integer
        claimedAt:
          type: string
        note:
          type: string

    AppData:
      type: object
      description: The domain's snapshot, as the app stores it.
      required: [version, cards, benefits, claims, settings]
      additionalProperties: false
      properties:
        version:
          type: integer
        cards:
          type: array
          items:
            $ref: '#/components/schemas/Card'
        benefits:
          type: array
          items:
            $ref: '#/components/schemas/Benefit'
        claims:
          type: array
          items:
            $ref: '#/components/schemas/Claim'
        settings:
          type: object
          required: [useSoonDays, theme]
          properties:
            useSoonDays:
              type: integer
            theme:
              type: string
        termsChanged:
          type: array
          description: |
            The caller's own "terms changed" marks, one per linked card whose
            template published a version they have not yet marked seen. The
            app's snapshot parser ignores it.
          items:
            $ref: '#/components/schemas/TermsChanged'
        access:
          type: object
          description: What the caller may do with each card, by card id. The app's snapshot parser ignores it.
          additionalProperties:
            $ref: '#/components/schemas/Access'
        people:
          type: array
          description: The owner of each card shared with the caller, once each. The app's snapshot parser ignores it.
          items:
            $ref: '#/components/schemas/Person'

    TermsChanged:
      type: object
      required: [cardId, version, effectiveFrom, changes]
      additionalProperties: false
      properties:
        cardId:
          type: string
        version:
          type: integer
        effectiveFrom:
          type: string
          format: date
        changes:
          type: array
          description: Each change, worded to follow "Your <card>'s".
          items:
            type: string

    CardWithBenefits:
      type: object
      required: [card, benefits]
      additionalProperties: false
      properties:
        card:
          $ref: '#/components/schemas/Card'
        benefits:
          type: array
          items:
            $ref: '#/components/schemas/Benefit'

    ConvertedCard:
      type: object
      required: [card, benefits, replaces, benefitIds]
      additionalProperties: false
      properties:
        card:
          $ref: '#/components/schemas/Card'
        benefits:
          type: array
          items:
            $ref: '#/components/schemas/Benefit'
        replaces:
          type: string
          description: The linked card's id, now deleted.
        benefitIds:
          type: object
          description: Each old credit id mapped to its new one.
          additionalProperties:
            type: string

    NewCard:
      type: object
      required: [anniversaryOn]
      description: With `templateId`, a linked card; without, `issuer`, `product`, `network` and `annualFeeCents` are required.
      properties:
        templateId:
          type: string
        label:
          type: string
        anniversaryOn:
          type: string
          format: date
        kind:
          type: string
          enum: [personal, business]
        last4:
          type: string
        issuer:
          type: string
        product:
          type: string
        network:
          type: string
          enum: [amex, visa, mastercard, discover, other]
        annualFeeCents:
          type: integer
          minimum: 0

    CardPatch:
      type: object
      properties:
        label:
          type: [string, 'null']
        kind:
          type: string
          enum: [personal, business]
        last4:
          type: [string, 'null']
        anniversaryOn:
          type: string
          format: date
        archived:
          type: boolean
        issuer:
          type: string
        product:
          type: string
        network:
          type: string
          enum: [amex, visa, mastercard, discover, other]
        annualFeeCents:
          type: integer
          minimum: 0

    CreditTerms:
      type: object
      description: A household credit's terms, checked by the domain's rules.
      required: [name, category, valueCents, cadence, anchor]
      properties:
        name:
          type: string
        description:
          type: string
        category:
          type: string
        icon:
          type: string
        merchant:
          type: string
        valueCents:
          type: integer
          minimum: 1
        cadence:
          type: string
        anchor:
          type: string
        intervalMonths:
          type: integer
        enrollmentRequired:
          type: boolean
        spendThresholdCents:
          type: integer
        endsOn:
          type: string
          format: date
        redemptionSteps:
          type: array
          items:
            type: string
        notes:
          type: string

    BenefitState:
      type: object
      properties:
        enrolledAt:
          type: [string, 'null']
        enrollmentNote:
          type: [string, 'null']
        enrollmentUrl:
          type: [string, 'null']
        spendMetAt:
          type: [string, 'null']
        active:
          type: boolean
        optedOutAt:
          type: [string, 'null']
          description: When the household opted out of the credit; null reactivates it.
        trackedFrom:
          type: [string, 'null']
          format: date
          description: The day tracking resumed after an opt-out.

    NewClaim:
      type: object
      required: [benefitId, cycleKey, amountCents]
      properties:
        benefitId:
          type: string
        cycleKey:
          type: string
          format: date
        amountCents:
          type: integer
          minimum: 1
        claimedAt:
          type: string
          description: When it was spent; now when absent.
        note:
          type: string

    NotificationSettings:
      type: object
      required: [enabled, timeOfDay, minValueCents, annualFeeReminder, enrollmentReminder]
      properties:
        enabled:
          type: boolean
        timeOfDay:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: Local time, 24-hour HH:MM.
        minValueCents:
          type: integer
          minimum: 0
        annualFeeReminder:
          type: boolean
        enrollmentReminder:
          type: boolean

    MemberPreferences:
      allOf:
        - $ref: '#/components/schemas/NotificationSettings'
      type: object
      required: [mutedCardIds, mutedBenefitIds, lastCallBenefitIds]
      properties:
        mutedCardIds:
          type: array
          items:
            type: string
        mutedBenefitIds:
          type: array
          items:
            type: string
        lastCallBenefitIds:
          type: array
          description: Credits the member hears about only on the last rung (Last chance). A mute outranks it.
          items:
            type: string

    NotificationLevel:
      type: string
      enum: [periodically, lastChance, silenced]
      description: |
        How much the member hears about one credit: every rung, only the
        last, or nothing. Silence keeps last call, so unsilencing returns to
        the earlier level.

    Access:
      type: string
      enum: [owner, record, view]
      description: |
        What a person may do with a card: everything as its owner; claims
        and a credit's state with `record`; read it, and keep their own
        preferences on it, with `view`.

    ShareAccess:
      type: string
      enum: [view, record]
      description: The access a share gives.

    Person:
      type: object
      required: [id, name, email]
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: [string, 'null']
          description: The name on their sign-in, when it carries one.
        email:
          type: [string, 'null']

    Share:
      type: object
      description: |
        A share as one side sees it: the other person, the access it gives,
        and all the owner's cards (including later ones) or the chosen ones.
      required: [id, name, email, access, allCards]
      additionalProperties: false
      properties:
        id:
          type: string
          description: The other person's user id.
        name:
          type: [string, 'null']
        email:
          type: [string, 'null']
        access:
          $ref: '#/components/schemas/ShareAccess'
        allCards:
          type: boolean
        cardIds:
          type: array
          description: The chosen cards, when not all of them.
          items:
            type: string

    Shares:
      type: object
      required: [given, received]
      additionalProperties: false
      properties:
        given:
          type: array
          description: Each person the caller shares with.
          items:
            $ref: '#/components/schemas/Share'
        received:
          type: array
          description: Each person who shares with the caller.
          items:
            $ref: '#/components/schemas/Share'

    SharePatch:
      type: object
      properties:
        access:
          $ref: '#/components/schemas/ShareAccess'
        allCards:
          type: boolean
          description: True to share every card, including ones added later. Leave out `cardIds` then.
        cardIds:
          type: array
          description: The caller's cards to share, in place of all of them.
          items:
            type: string

    InviteRequest:
      type: object
      required: [access]
      properties:
        access:
          $ref: '#/components/schemas/ShareAccess'
        allCards:
          type: boolean
          description: True to share every card, including ones added later. Leave out `cardIds` then.
        cardIds:
          type: array
          description: The caller's cards to share, when not all of them.
          items:
            type: string

    Invite:
      type: object
      required: [code, link, access, allCards, expiresAt]
      additionalProperties: false
      properties:
        code:
          type: string
          pattern: '^[A-Z2-9]{8}$'
          description: Eight characters with no 0, O, 1, I, L or U.
        link:
          type: string
          description: A web address ending in `/invite/<code>`.
        access:
          $ref: '#/components/schemas/ShareAccess'
        allCards:
          type: boolean
        cardIds:
          type: array
          items:
            type: string
        expiresAt:
          type: string
          format: date-time

    InviteOffer:
      type: object
      required: [owner, access, allCards, expiresAt]
      additionalProperties: false
      properties:
        owner:
          $ref: '#/components/schemas/Person'
        access:
          $ref: '#/components/schemas/ShareAccess'
        allCards:
          type: boolean
        cardCount:
          type: integer
          description: How many cards it shares, when not all of them.
        expiresAt:
          type: string
          format: date-time

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: A short machine-readable reason.

    InvalidField:
      type: object
      required: [error, field]
      additionalProperties: false
      properties:
        error:
          const: invalid
        field:
          type: string
          description: The first field that is missing, blank or malformed; `body` when the body is not a JSON object.

  responses:
    SystemMaintained:
      description: The terms of a card or credit linked to the catalogue belong to the catalogue (`system maintained`); convert the card to change them.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Error'
            properties:
              error:
                const: system maintained
    Forbidden:
      description: The caller can see the card, but their access to it does not allow this.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Error'
            properties:
              error:
                const: forbidden
    InviteGone:
      description: The invite was used already (`invite used`) or has expired (`invite expired`).
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Error'
            properties:
              error:
                enum: [invite used, invite expired]
    Invalid:
      description: A field is missing, blank or malformed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InvalidField'
    NotFound:
      description: Nothing is stored under that id.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Error'
            properties:
              error:
                const: not found
    Unauthenticated:
      description: No bearer token, or one that does not verify.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Error'
            properties:
              error:
                const: unauthenticated
    Unavailable:
      description: |
        The process was started without what the route needs: a database
        (`no database`) or, for a signed-in route, a Firebase project to
        verify tokens against (`no auth`).
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Error'
            properties:
              error:
                enum: [no database, no auth]
    Internal:
      description: Anything uncaught; the detail goes to the log, never to the client.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Error'
            properties:
              error:
                const: internal
