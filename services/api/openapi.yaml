openapi: 3.1.0
info:
  title: HelpMe Reward api
  version: 0.1.0
  summary: The service tier behind the HelpMe Reward app.
  description: |
    Hand-written and spec-first: every route, parameter and body is
    documented here before it is served, and `test/contract_test.dart`
    holds the router and every response to this file. Nothing is generated
    from it. Bodies are JSON in the domain's snapshot spelling
    (`packages/domain/lib/src/json.dart`).
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://reward-api-bduraqeztq-uc.a.run.app
    description: staging
tags:
  - name: health
    description: Liveness.
  - name: devices
    description: Push-device registration.
  - name: me
    description: The signed-in caller.
  - name: household
    description: The caller's household, its members and invites.
security:
  - firebase: []

paths:
  /health:
    get:
      tags: [health]
      operationId: getHealth
      security: []
      summary: Liveness
      description: |
        200 while the process serves, with the version so a deploy can be
        told apart from the last one. Not `/healthz`, which Google's
        frontend answers itself on `run.app` hosts.
      responses:
        '200':
          description: The process is serving.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '500':
          $ref: '#/components/responses/Internal'

  /v1/me:
    get:
      tags: [me]
      operationId: getMe
      summary: The signed-in caller
      description: |
        The caller's user, created on their first authenticated call to any
        route and reused after.
      responses:
        '200':
          description: The caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/household:
    get:
      tags: [household]
      operationId: getHousehold
      summary: The caller's household
      description: |
        Every person is in exactly one household. A new user owns a new,
        empty one, made on their first authenticated call.
      responses:
        '200':
          description: The household and its members.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Household'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/household/invites:
    post:
      tags: [household]
      operationId: createInvite
      summary: Invite someone to the household
      description: |
        Owner only. The code is single-use and expires after seven days; the
        link carries the same code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteRequest'
      responses:
        '201':
          description: The invite.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invite'
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/invites/{code}/accept:
    post:
      tags: [household]
      operationId: acceptInvite
      summary: Join a household with an invite
      description: |
        Moves the caller into the invite's household with its role, leaving
        their current one. The last member out takes that household, and
        its data, with them. An owner cannot leave while other members
        remain. When the current household holds cards, `confirmLeave: true`
        is required.
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptRequest'
      responses:
        '200':
          description: The household joined.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Household'
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            `household holds cards` without `confirmLeave`, `owner has
            members`, or `already a member`.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
                properties:
                  error:
                    enum: [household holds cards, owner has members, already a member]
        '410':
          description: The invite was used already (`invite used`) or has expired (`invite expired`).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
                properties:
                  error:
                    enum: [invite used, invite expired]
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/household/members/{userId}:
    delete:
      tags: [household]
      operationId: removeMember
      summary: Remove a member
      description: |
        Owner only. The member loses access at once; on their next call they
        start again in a new, empty household. They take nothing with them.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Removed.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The owner cannot remove themselves (`owner cannot leave`).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
                properties:
                  error:
                    const: owner cannot leave
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/devices:
    post:
      tags: [devices]
      operationId: registerDevice
      security: []
      summary: Register a device for push
      description: |
        Upserts by token: a repeat registration replaces the installation,
        platform and zone. The zone must be known to Postgres's
        `pg_timezone_names`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Device'
      responses:
        '200':
          description: Registered; the stored fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '400':
          $ref: '#/components/responses/Invalid'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/devices/{token}:
    delete:
      tags: [devices]
      operationId: unregisterDevice
      security: []
      summary: Unregister a device
      parameters:
        - name: token
          in: path
          required: true
          description: The FCM token the device registered under.
          schema:
            type: string
      responses:
        '204':
          description: Removed.
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'

components:
  securitySchemes:
    firebase:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A Firebase ID token from Identity Platform (Google or Apple sign-in)
        for this environment's project, verified against Google's published
        keys: RS256, issuer `https://securetoken.google.com/<project>`,
        audience the project, unexpired.

  schemas:
    User:
      type: object
      required: [id, email]
      additionalProperties: false
      properties:
        id:
          type: string
          description: The user's id in this service.
        email:
          type: [string, 'null']
          description: The email on the sign-in account, when it shares one.

    Health:
      type: object
      required: [status, version]
      additionalProperties: false
      properties:
        status:
          const: ok
        version:
          type: string
          description: The api's package version.

    Device:
      type: object
      required: [token, installationId, platform, timezone]
      additionalProperties: false
      properties:
        token:
          type: string
          minLength: 1
          description: The FCM registration token.
        installationId:
          type: string
          minLength: 1
          description: An id the app generated for its own installation.
        platform:
          type: string
          enum: [ios, android]
        timezone:
          type: string
          minLength: 1
          description: An IANA zone name, such as `Europe/London`.

    Role:
      type: string
      enum: [owner, editor, reader]
      description: Owners manage members; editors change the data; readers only read it.

    Member:
      type: object
      required: [userId, email, role, joinedAt]
      additionalProperties: false
      properties:
        userId:
          type: string
        email:
          type: [string, 'null']
        role:
          $ref: '#/components/schemas/Role'
        joinedAt:
          type: string
          format: date-time

    Household:
      type: object
      required: [id, role, members]
      additionalProperties: false
      properties:
        id:
          type: string
        role:
          $ref: '#/components/schemas/Role'
          description: The caller's own role.
        members:
          type: array
          items:
            $ref: '#/components/schemas/Member'

    InviteRequest:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [read, edit]

    Invite:
      type: object
      required: [code, link, role, expiresAt]
      additionalProperties: false
      properties:
        code:
          type: string
          pattern: '^[A-Z2-9]{8}$'
          description: Eight characters with no 0, O, 1, I, L or U.
        link:
          type: string
          description: A web address ending in `/invite/<code>`.
        role:
          type: string
          enum: [read, edit]
        expiresAt:
          type: string
          format: date-time

    AcceptRequest:
      type: object
      properties:
        confirmLeave:
          type: boolean
          description: Required as true when the caller's current household holds cards.

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: A short machine-readable reason.

    InvalidField:
      type: object
      required: [error, field]
      additionalProperties: false
      properties:
        error:
          const: invalid
        field:
          type: string
          description: The first field that is missing, blank or malformed; `body` when the body is not a JSON object.

  responses:
    Forbidden:
      description: The caller's role does not allow this.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Error'
            properties:
              error:
                const: forbidden
    Invalid:
      description: A field is missing, blank or malformed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InvalidField'
    NotFound:
      description: Nothing is stored under that id.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Error'
            properties:
              error:
                const: not found
    Unauthenticated:
      description: No bearer token, or one that does not verify.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Error'
            properties:
              error:
                const: unauthenticated
    Unavailable:
      description: |
        The process was started without what the route needs: a database
        (`no database`) or, for a signed-in route, a Firebase project to
        verify tokens against (`no auth`).
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Error'
            properties:
              error:
                enum: [no database, no auth]
    Internal:
      description: Anything uncaught; the detail goes to the log, never to the client.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Error'
            properties:
              error:
                const: internal
