# The Dart pub workspace (Dart 3.12): one resolution for every Dart package in
# the repository. `fvm dart pub get` here resolves them all; `fvm dart analyze`
# here analyses them all. The Flutter SDK, and so the Dart SDK, is pinned in
# .fvmrc and managed with FVM.
name: helpmebrands_reward_workspace
publish_to: none
environment:
  sdk: ^3.12.0
workspace:
  - packages/domain
  - apps/mobile
  - services/api
