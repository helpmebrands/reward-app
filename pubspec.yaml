# The Dart pub workspace (Dart 3.12): one resolution for every Dart package in
# the repository. `dart pub get` here resolves them all; `dart analyze` here
# analyses them all.
name: helpmebrands_reward_workspace
publish_to: none
environment:
  sdk: ^3.12.0
workspace:
  - packages/domain
  - apps/mobile
  - services/api
