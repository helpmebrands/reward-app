# Runs on every pull request. Branch protection on `develop` should require the
# checks this produces, which is what makes the gate real rather than advisory.
name: CI

on:
  pull_request:
    branches: [develop, main]

# A new push to a PR makes the previous run irrelevant, so cancel it. (Deploys
# are the opposite — see cd.yml.)
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# `id-token` lets the infra job mint an OIDC token for a keyless `pulumi
# preview` against the staging state (see verify.yml).
permissions:
  contents: read
  id-token: write

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
