# Deploys the static site in apps/site to Cloudflare Pages: `develop` to the
# staging project (staging.helpmereward.com), `main` to the prod stack
# (helpmereward.com). Runbook 09 sets Cloudflare up.
#
# The Cloudflare API token lives in Secret Manager, not in GitHub: the job
# authenticates to Google with Workload Identity Federation, which mints a
# short-lived token pinned to this repository, and reads the secret with it.
# No workflow here references a GitHub secret.
name: CD

on:
  push:
    branches: [develop, main]
    # The api deploys through cd-api.yml; a merge confined to it, the shared
    # domain package or the Flutter app does not redeploy the site.
    paths-ignore:
      - 'services/api/**'
      - 'packages/domain/**'
      - 'apps/mobile/**'
      - '.github/workflows/cd-api.yml'
  # Redeploying the current branch without an empty commit.
  workflow_dispatch:

# One deploy per branch at a time, never cancelled in flight.
concurrency:
  group: deploy-site-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  # The deployed commit passes the gate itself, rather than inheriting a tick
  # from a pre-merge run against a different tree.
  verify:
    uses: ./.github/workflows/verify.yml

  deploy:
    name: Deploy to Cloudflare Pages
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Each stack writes its variables onto the environment named after it.
    environment:
      name: ${{ github.ref_name == 'main' && 'prod' || 'staging' }}
      url: ${{ vars.SITE_URL }}

    steps:
      - uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Masked before it is exported, so a failing step cannot print it.
      - name: Read the Cloudflare token from Secret Manager
        run: |
          set -euo pipefail
          token=$(gcloud secrets versions access latest --secret "${{ vars.SECRET_CLOUDFLARE_API_TOKEN }}" --project "${{ vars.GCP_PROJECT_ID }}")
          echo "::add-mask::$token"
          echo "CLOUDFLARE_API_TOKEN=$token" >> "$GITHUB_ENV"

      # The branch is the project's production branch (runbook 09), so this
      # is a production deployment of the stack's own project. Pinned, so a
      # wrangler release cannot change what a deploy does.
      - name: Deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: ${{ vars.PAGES_PROJECT }}
        run: >-
          npx --yes wrangler@4.140.0 pages deploy apps/site/public --project-name "$PAGES_PROJECT" --branch "${{ github.ref_name }}" --commit-hash "${{ github.sha }}" --commit-dirty=true

      # A finished upload only means Pages accepted the files. These say the
      # custom domain serves them, and that 404.html stops the single-page
      # fallback from answering every missing path with the home page.
      - name: Smoke test the site
        env:
          URL: ${{ vars.SITE_URL }}
        run: |
          set -euo pipefail
          echo "Serving at $URL"

          ok=""
          for i in $(seq 1 12); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "$URL/" || true)
            if [ "$code" = "200" ]; then ok=1; break; fi
            sleep 5
          done
          [ -n "$ok" ] || { echo "index -> $code"; exit 1; }
          echo "  / -> 200"

          code=$(curl -sS -o /dev/null -w '%{http_code}' "$URL/nope")
          [ "$code" = "404" ] || { echo "/nope -> $code, expected 404"; exit 1; }
          echo "  /nope -> 404"

      - name: Summarise
        if: always()
        run: |
          {
            echo "### Deploy"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Branch | \`${{ github.ref_name }}\` |"
            echo "| URL | ${{ vars.SITE_URL }} |"
          } >> "$GITHUB_STEP_SUMMARY"
