# The quality gate, in one place.
#
# Called by ci.yml on every pull request and by cd.yml immediately before a
# deploy. Deploys re-run it rather than trusting the PR's green tick: the merge
# commit is not the commit CI tested, and a semantic conflict between two
# independently-green PRs surfaces here rather than in production.
name: Verify

on:
  workflow_call:

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      # `npm ci` rather than `npm install`: it installs exactly the lockfile and
      # fails if package.json and the lock have drifted apart.
      - name: Install dependencies
        run: npm ci

      - name: Lint and format check
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # `npm run build` typechecks again on its way through, but running it
      # here also proves the production bundle and the PWA manifest generate.
      - name: Build
        run: npm run build

      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ github.sha }}
          path: apps/pwa/dist/
          retention-days: 7

  # Accessibility, against the real build. axe in jsdom (part of `npm test`)
  # sees the DOM but no layout; this sees layout and colour, at four widths
  # in both themes. It runs on the bundle the verify job just produced.
  a11y:
    name: Accessibility gate
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download build output
        uses: actions/download-artifact@v8
        with:
          name: dist-${{ github.sha }}
          path: apps/pwa/dist/

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run axe at 320, 402, 768 and 1280px in both themes
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.sha }}
          path: apps/pwa/playwright-report/
          retention-days: 7

  # The Pulumi program is its own npm workspace with its own compiler settings.
  # A type error there is otherwise found by whoever next runs `pulumi up` by
  # hand. After the typecheck, `pulumi preview` shows the planned diff against
  # the staging state, so a review can see exactly what an infrastructure
  # change would do. It authenticates keylessly as the deployer, which holds
  # read roles on the project, the state bucket and the secrets key for this
  # purpose and nothing that could apply the change.
  infra:
    name: Infra typechecks and previews
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    # The stack writes the variables this job reads onto the environment named
    # after itself, so the job runs there rather than reading repository-level
    # variables that no longer exist.
    environment: staging

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --workspace infra --workspace infra-repo

      - name: Typecheck
        run: |
          npm run typecheck --workspace infra
          npm run typecheck --workspace infra-repo

      - name: Test
        run: npm test --workspace infra-repo

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}

      # Install-only: no `command`, so the action stops after putting the CLI
      # on the path and the run steps below drive it. pulumi/setup-pulumi
      # would do the same but still declares Node 12 and is unmaintained.
      - uses: pulumi/actions@v7
        with:
          pulumi-version: 3.248.0

      - name: Preview against staging
        working-directory: infra
        env:
          # The GitHub provider reads this. The workflow token can read the
          # repository but not administer it, which is all a preview needs.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          pulumi login gs://helpme-reward-staging-pulumi-state
          pulumi stack select staging
          pulumi preview --non-interactive --diff

      - name: Preview the repository project
        working-directory: infra-repo
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          pulumi login gs://helpme-reward-staging-pulumi-state
          pulumi stack select repo
          pulumi preview --non-interactive --diff

  # The Dart pub workspace: packages/domain and the Flutter app, the service
  # tier as it lands. The workspace includes a Flutter package, so the Dart
  # SDK comes from the Flutter SDK; a standalone Dart cannot resolve it.
  # Analysed at the root so every package is covered; tested per package
  # because `dart test` runs in one package.
  dart:
    name: Dart analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Resolve the workspace
        run: dart pub get

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Test packages/domain
        run: dart test
        working-directory: packages/domain

  # The Flutter app, in its own job so a widget failure names itself.
  flutter:
    name: Flutter analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Resolve the workspace
        run: dart pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

  # The service tier: analysed and tested in the workspace, then built as a
  # container and smoke-tested, so a broken Dockerfile fails review rather
  # than the deploy.
  api:
    name: Api analyze, test and container
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The integration tests run the migrations against a real PostgreSQL,
    # the same image as services/api/docker-compose.yml. `sslmode=disable`
    # because the container speaks plain TCP and the driver defaults to TLS.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: reward
          POSTGRES_PASSWORD: reward
          POSTGRES_DB: reward
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reward -d reward"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Resolve the workspace
        run: dart pub get

      - name: Analyze
        run: dart analyze --fatal-infos
        working-directory: services/api

      - name: Test
        run: dart test
        working-directory: services/api
        env:
          DATABASE_URL: postgres://reward:reward@localhost:5432/reward?sslmode=disable

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/api/Dockerfile
          push: false
          load: true
          tags: reward-api:pr-${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Smoke test the container
        run: |
          set -euo pipefail
          docker run -d --name reward-api-test -p 8081:8080 reward-api:pr-${{ github.sha }}
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:8081/health; then break; fi
            if [ "$i" = "30" ]; then
              echo "container never became ready"; docker logs reward-api-test; exit 1
            fi
            sleep 1
          done
          echo "--- health"
          body=$(curl -fsS http://localhost:8081/health)
          echo "  $body"
          case "$body" in
            *'"status":"ok"'*) ;;
            *) echo "unexpected body"; exit 1 ;;
          esac
          docker rm -f reward-api-test

  container:
    name: Container builds
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      # Build only — nothing is pushed from a pull request. This exists so a
      # broken Dockerfile or nginx config fails review rather than the deploy.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/pwa/Dockerfile
          push: false
          load: true
          tags: reward-app:pr-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Starts the real container and checks the things that are easy to break
      # and silent in production: the SPA fallback, and the no-store header on
      # the service worker that lets clients notice a new build at all.
      - name: Smoke test the container
        run: |
          set -euo pipefail
          docker run -d --name reward-app-test -p 8080:8080 reward-app:pr-${{ github.sha }}

          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:8080/; then break; fi
            if [ "$i" = "30" ]; then
              echo "container never became ready"; docker logs reward-app-test; exit 1
            fi
            sleep 1
          done

          echo "--- index responds"
          curl -fsS -o /dev/null -w '  / -> %{http_code}\n' http://localhost:8080/

          echo "--- client-side route falls back to the shell"
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/credits)
          [ "$code" = "200" ] || { echo "  /credits -> $code, expected 200"; exit 1; }
          echo "  /credits -> 200"

          echo "--- a missing asset 404s instead of returning HTML"
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/assets/nope.js)
          [ "$code" = "404" ] || { echo "  /assets/nope.js -> $code, expected 404"; exit 1; }
          echo "  /assets/nope.js -> 404"

          echo "--- the service worker is not cacheable"
          cc=$(curl -sS -D - -o /dev/null http://localhost:8080/sw.js | tr -d '\r' | grep -i '^cache-control:' || true)
          case "$cc" in
            *no-store*) echo "  sw.js -> $cc" ;;
            *) echo "  sw.js cache-control was '$cc', expected no-store"; exit 1 ;;
          esac

          docker rm -f reward-app-test
