# The quality gate, in one place.
#
# Called by ci.yml on every pull request and by cd.yml immediately before a
# deploy. Deploys re-run it rather than trusting the PR's green tick: the merge
# commit is not the commit CI tested, and a semantic conflict between two
# independently-green PRs surfaces here rather than in production.
name: Verify

on:
  workflow_call:

jobs:
  # The npm workspaces are the two Pulumi programs; `npm test` also runs the
  # repository config suites in infra/tests.
  verify:
    name: Typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # `npm ci` rather than `npm install`: it installs exactly the lockfile and
      # fails if package.json and the lock have drifted apart.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  # The Pulumi program is its own npm workspace with its own compiler settings.
  # A type error there is otherwise found by whoever next runs `pulumi up` by
  # hand. After the typecheck, `pulumi preview` shows the planned diff against
  # the staging state, so a review can see exactly what an infrastructure
  # change would do. It authenticates keylessly as the deployer, which holds
  # read roles on the project, the state bucket and the secrets key for this
  # purpose and nothing that could apply the change.
  infra:
    name: Infra typechecks and previews
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    # The stack writes the variables this job reads onto the environment named
    # after itself, so the job runs there rather than reading repository-level
    # variables that no longer exist.
    environment: staging

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --workspace infra --workspace infra-repo

      - name: Typecheck
        run: |
          npm run typecheck --workspace infra
          npm run typecheck --workspace infra-repo

      - name: Test
        run: npm test --workspace infra-repo

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}

      # Install-only: no `command`, so the action stops after putting the CLI
      # on the path and the run steps below drive it. pulumi/setup-pulumi
      # would do the same but still declares Node 12 and is unmaintained.
      - uses: pulumi/actions@v7
        with:
          pulumi-version: 3.248.0

      - name: Preview against staging
        working-directory: infra
        env:
          # The GitHub provider reads this. The workflow token can read the
          # repository but not administer it, which is all a preview needs.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          pulumi login gs://helpme-reward-staging-pulumi-state
          pulumi stack select staging
          pulumi preview --non-interactive --diff

      - name: Preview the repository project
        working-directory: infra-repo
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          pulumi login gs://helpme-reward-staging-pulumi-state
          pulumi stack select repo
          pulumi preview --non-interactive --diff

  # The Dart pub workspace: packages/domain and the Flutter app, the service
  # tier as it lands. The workspace includes a Flutter package, so the Dart
  # SDK comes from the Flutter SDK; a standalone Dart cannot resolve it.
  # Analysed at the root so every package is covered; tested per package
  # because `dart test` runs in one package.
  dart:
    name: Dart analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Resolve the workspace
        run: dart pub get

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Test packages/domain
        run: dart test
        working-directory: packages/domain

  # The Flutter app, in its own job so a widget failure names itself.
  flutter:
    name: Flutter analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Resolve the workspace
        run: dart pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

      # The api's base URL is a build-time define; its test only means
      # something with one.
      - name: Test the api define
        run: flutter test test/api_config_test.dart --dart-define=API_BASE_URL=https://example.test

  # The service tier: analysed and tested in the workspace, then built as a
  # container and smoke-tested, so a broken Dockerfile fails review rather
  # than the deploy.
  api:
    name: Api analyze, test and container
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The integration tests run the migrations against a real PostgreSQL,
    # the same image as services/api/docker-compose.yml. `sslmode=disable`
    # because the container speaks plain TCP and the driver defaults to TLS.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: reward
          POSTGRES_PASSWORD: reward
          POSTGRES_DB: reward
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reward -d reward"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Resolve the workspace
        run: dart pub get

      - name: Analyze
        run: dart analyze --fatal-infos
        working-directory: services/api

      # The hand-written contract must be valid OpenAPI 3.1 before the
      # contract test holds the router to it. Pinned, so a Redocly release
      # cannot change what passes.
      - name: Lint the OpenAPI spec
        run: npx --yes @redocly/cli@2.53.3 lint services/api/openapi.yaml

      - name: Test
        run: dart test
        working-directory: services/api
        env:
          DATABASE_URL: postgres://reward:reward@localhost:5432/reward?sslmode=disable

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/api/Dockerfile
          push: false
          load: true
          tags: reward-api:pr-${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Smoke test the container
        run: |
          set -euo pipefail
          docker run -d --name reward-api-test -p 8081:8080 reward-api:pr-${{ github.sha }}
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:8081/health; then break; fi
            if [ "$i" = "30" ]; then
              echo "container never became ready"; docker logs reward-api-test; exit 1
            fi
            sleep 1
          done
          echo "--- health"
          body=$(curl -fsS http://localhost:8081/health)
          echo "  $body"
          case "$body" in
            *'"status":"ok"'*) ;;
            *) echo "unexpected body"; exit 1 ;;
          esac
          docker rm -f reward-api-test
