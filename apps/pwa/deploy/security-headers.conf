# Security headers, in a file because nginx's add_header does NOT inherit:
# the moment a location block declares one add_header, it drops every header
# set by its parent. Each location therefore includes this explicitly, and a
# location that forgets to is a silently unprotected route.
add_header  X-Content-Type-Options  "nosniff" always;
add_header  X-Frame-Options         "DENY"    always;
add_header  Referrer-Policy         "no-referrer" always;
add_header  Permissions-Policy      "geolocation=(), camera=(), microphone=(), payment=()" always;

# The app is same-origin apart from the Inter webfont, so the allowances are
# narrow. `connect-src` is 'self' only — a push backend's origin has to be
# added here or the subscription POST is blocked.
#
# style-src needs 'unsafe-inline' because Solid's style={{...}} prop writes a
# style *attribute*, which this directive governs. Verified: removing it leaves
# the app unstyled. It is a far weaker concession than script-src would be —
# script-src stays strict, which is the directive that stops an injection
# becoming code execution. Tightening it means moving every inline style in
# src/ into a class, which is an app change, not a deployment one.
add_header  Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'; object-src 'none'" always;
