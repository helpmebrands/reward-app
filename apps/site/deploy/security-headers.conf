# Security headers, in a file because nginx's add_header does NOT inherit:
# the moment a location block declares one add_header, it drops every header
# set by its parent. Each location therefore includes this explicitly, and a
# location that forgets to is a silently unprotected route.
add_header  X-Content-Type-Options  "nosniff" always;
add_header  X-Frame-Options         "DENY"    always;
add_header  Referrer-Policy         "no-referrer" always;
add_header  Permissions-Policy      "geolocation=(), camera=(), microphone=(), payment=()" always;

# The site is static and same-origin: no scripts, no fonts, no requests.
add_header  Content-Security-Policy "default-src 'self'; script-src 'none'; style-src 'self'; img-src 'self' data:; connect-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'; object-src 'none'" always;
